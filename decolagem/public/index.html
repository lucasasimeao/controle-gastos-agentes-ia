<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decolagem - Controle Financeiro</title>
  <style>
    :root {
      color-scheme: dark;
      color: #e8eef5;
      background: #070d14;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --surface: rgba(12, 23, 39, 0.96);
      --surface-strong: rgba(18, 35, 62, 1);
      --surface-soft: rgba(25, 45, 75, 0.92);
      --border: rgba(120, 149, 181, 0.16);
      --muted: #94a4bc;
      --text: #f5f8ff;
      --accent: #1bb7ff;
      --accent-strong: #0fb4e9;
      --success: #13d391;
      --card: rgba(11, 24, 40, 0.95);
      --shadow: 0 26px 60px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top left, rgba(10, 119, 198, 0.18), transparent 26%),
                  radial-gradient(circle at bottom right, rgba(24, 210, 171, 0.12), transparent 28%),
                  #06101d;
    }

    body {
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 32px;
      padding: 0 0 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #2fd3c2;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      color: #9bb5cf;
      font-size: 1.1rem;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 24px;
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 2.4vw, 3rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 55ch;
    }

    .grid {
      display: grid;
      gap: 24px;
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
      overflow: hidden;
    }

    .card strong {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 10px;
      color: #daf1ff;
    }

    .subtext {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .form-row {
      display: grid;
      gap: 16px;
      grid-template-columns: 1.5fr 1fr;
      margin: 18px 0 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #b7ccdf;
      font-size: 0.92rem;
    }

    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px 18px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    input::placeholder {
      color: rgba(255,255,255,0.38);
    }

    input:focus {
      border-color: rgba(27, 183, 255, 0.8);
      transform: translateY(-1px);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #0b9cb5, #0bce9b);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .note-card {
      background: linear-gradient(180deg, rgba(18, 45, 69, 0.98), rgba(13, 31, 50, 0.95));
      border: 1px solid rgba(40, 82, 117, 0.18);
    }

    .note-card h2 {
      margin: 0 0 10px;
      color: #7df1d9;
    }

    .note-card p {
      margin: 0;
      color: #a6c7dc;
    }

    .expenses-panel {
      display: flex;
      flex-direction: column;
    }

    .expenses-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .expenses-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(27, 183, 255, 0.12);
      color: #b1ddff;
      font-size: 0.84rem;
    }

    .expenses-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .expense-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .expense-meta {
      display: grid;
      gap: 6px;
    }

    .expense-meta strong {
      font-size: 1rem;
      color: var(--text);
    }

    .expense-meta span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .expense-value {
      font-weight: 700;
      color: #c7f9ea;
      white-space: nowrap;
    }

    .total-row {
      margin-top: 16px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(10, 25, 42, 0.95);
      border: 1px solid rgba(27, 183, 255, 0.14);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-row span {
      color: #8abbe3;
      font-size: 0.95rem;
    }

    .total-row strong {
      font-size: 1.25rem;
      color: #72f0d0;
    }

    .error-message {
      margin-top: 10px;
      color: #ff7e84;
      font-size: 0.95rem;
    }

    @media (max-width: 900px) {
      .hero, .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      main {
        padding: 20px 16px 32px;
      }

      .card {
        padding: 22px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">Decolagem</div>
      <div class="status">🟢</div>
    </header>

    <section class="hero">
      <div>
        <h1>Controle Financeiro</h1>
        <p>Registre e visualize seus gastos com clareza, apoiado por um painel simples e elegante inspirado no layout da imagem.</p>
      </div>
      <div class="card note-card">
        <h2>Voe Alto</h2>
        <p>Sua liberdade financeira começa com um passo simples hoje.</p>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <strong>Nova Despesa</strong>

        <div class="form-row">
          <label>
            Descrição
            <input id="description" type="text" placeholder="Ex: Supermercado" autocomplete="off" />
          </label>
          <label>
            Valor (R$)
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="0,00" />
          </label>
        </div>

        <button id="addButton">Adicionar</button>
        <p class="error-message" id="errorMessage" aria-live="polite"></p>
      </article>

      <article class="card expenses-panel">
        <div class="expenses-header">
          <h2>Minhas Despesas</h2>
          <span class="tag" id="monthTag"></span>
        </div>

        <ul class="expenses-list" id="expensesList"></ul>
        <div class="total-row">
          <span>Total de Gastos</span>
          <strong id="totalValue">R$ 0,00</strong>
        </div>
      </article>
    </section>
  </main>

  <script>
    const descriptionElement = document.getElementById('description');
    const amountElement = document.getElementById('amount');
    const addButton = document.getElementById('addButton');
    const expensesList = document.getElementById('expensesList');
    const totalValue = document.getElementById('totalValue');
    const errorMessage = document.getElementById('errorMessage');
    const monthTag = document.getElementById('monthTag');

    function formatCurrency(value) {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL',
        minimumFractionDigits: 2,
      }).format(value);
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) {
        return '-';
      }
      return new Intl.DateTimeFormat('pt-BR', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
      }).format(date);
    }

    function setCurrentMonthTag() {
      const now = new Date();
      const monthName = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(now);
      monthTag.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);
    }

    function showError(message) {
      errorMessage.textContent = message;
    }

    function clearError() {
      errorMessage.textContent = '';
    }

    function renderExpenses(expenses) {
      expensesList.innerHTML = '';
      let total = 0;

      if (expenses.length === 0) {
        expensesList.innerHTML = '<li class="expense-item"><div class="expense-meta"><strong>Sem despesas registradas</strong><span>Adicione um gasto para começar.</span></div></li>';
      } else {
        expenses.forEach((expense) => {
          total += expense.amount;

          const item = document.createElement('li');
          item.className = 'expense-item';
          item.innerHTML = `
            <div class="expense-meta">
              <strong>${expense.description}</strong>
              <span>${formatDate(expense.createdAt || new Date())}</span>
            </div>
            <div class="expense-value">${formatCurrency(expense.amount)}</div>
          `;
          expensesList.appendChild(item);
        });
      }

      totalValue.textContent = formatCurrency(total);
    }

    async function loadExpenses() {
      try {
        const response = await fetch('/expenses');
        if (!response.ok) {
          throw new Error('Não foi possível carregar as despesas.');
        }
        const data = await response.json();
        renderExpenses(data);
      } catch (error) {
        showError(error.message);
      }
    }

    async function addExpense() {
      clearError();
      const description = descriptionElement.value.trim();
      const amount = Number(amountElement.value);

      if (!description) {
        showError('Descrição é obrigatória.');
        return;
      }

      if (!amount || amount <= 0) {
        showError('Valor deve ser um número positivo.');
        return;
      }

      addButton.disabled = true;
      addButton.textContent = 'Salvando...';

      try {
        const response = await fetch('/expenses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description, amount }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Erro ao salvar a despesa.');
        }

        descriptionElement.value = '';
        amountElement.value = '';
        await loadExpenses();
      } catch (error) {
        showError(error.message);
      } finally {
        addButton.disabled = false;
        addButton.textContent = 'Adicionar';
      }
    }

    addButton.addEventListener('click', addExpense);
    descriptionElement.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        addExpense();
      }
    });

    setCurrentMonthTag();
    loadExpenses();
  </script>
</body>
</html>
